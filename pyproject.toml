[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcot-opsd"
version = "0.1.0"
description = "Group-contrastive visual evidence distillation for multimodal GRPO"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "pydantic>=2.7",
  "PyYAML>=6",
]

[project.optional-dependencies]
grounding = ["transformers>=4.57", "torch>=2.4"]
data = ["datasets>=3", "pandas>=2", "pyarrow>=17"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

