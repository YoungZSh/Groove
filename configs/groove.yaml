hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: true
  model:
    enable_activation_offload: false
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
  actor:
    optim:
      lr: 1.0e-6
      override_optimizer_config:
        fused: true
        foreach: false
    ppo_epochs: 1
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    calculate_entropy: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      reshard_after_forward: true
    policy_loss:
      loss_mode: vanilla
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
  rollout:
    mode: async
    n: 8
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    gpu_memory_utilization: 0.6
    free_cache_engine: true
    enable_sleep_mode: true
    layered_summon: false
    enforce_eager: true
    load_format: dummy
    enable_chunked_prefill: true
    max_num_seqs: 16

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

data:
  # The 2B launchers opt into plain reasoning followed by one terminal answer.
  response_format: original
  apply_chat_template_kwargs:
    enable_thinking: false
  image_max_pixels: null

reward:
  custom_reward_function:
    reward_kwargs:
      answer_reward_weight: 0.9
      format_reward_weight: 0.1

# Project-specific OPSD settings are inert during pure GRPO. They stay outside
# VERL's typed ActorConfig and are consumed only by the GROOVE adapter.
groove:
  enabled: false
  # Standalone launchers select rlsd_positive on this experimental branch.
  # Keep the additive objective selectable for matched comparisons.
  advantage_mode: opsd
  rlsd_lambda_initial: 0.5
  rlsd_lambda_decay_steps: 50
  rlsd_clip_range: 0.2
  rlsd_teacher_sync_interval: 10
  # Both contexts are scored by the pre-update actor. Targets stay detached
  # throughout this rollout batch's PPO updates and refresh on the next batch.
  opsd_advantage_coef: 0.01
  opsd_advantage_clip: null
  teacher_image_key: groove_teacher_images
  max_reprompt_len: 9216

trainer:
  use_v1: false
  val_before_train: false
  # Native V1 writes completed per-step timings, including logger calls, here.
  step_timing_dir: null
  best_checkpoint:
    enabled: false
    metric: val-core/vstar_bench/reward/mean@1
    mode: max

ray_kwargs:
  ray_init:
    include_dashboard: false
    object_store_memory: 8589934592
